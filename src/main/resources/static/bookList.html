<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>图书列表</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
        }

        /* 导航栏样式 */
        .nav {
            height: 60px;
            background-color: #2c3e50;
            padding: 0 40px;
            line-height: 60px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .nav-logo {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
        }

        /* 主体容器 */
        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .container h2 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 25px;
            border-left: 4px solid #409eff;
            padding-left: 12px;
        }

        /* 搜索栏区域 */
        #bookname {
            width: 260px;
            height: 38px;
            padding: 0 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #bookname:focus {
            border-color: #409eff;
        }

        /* 通用按钮样式 */
        button {
            height: 38px;
            padding: 0 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 0 6px;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        #btn_search {
            background-color: #409eff;
            color: #fff;
        }

        /* 新增按钮 */
        button[onclick] {
            background-color: #67c23a;
            color: #fff;
        }

        /* 表格样式 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #ebeef5;
            text-align: center;
            padding: 12px 8px;
        }

        th {
            background-color: #f5f7fa;
            font-weight: 600;
            color: #606266;
        }

        tbody tr:hover {
            background-color: #f9fafc;
        }

        /* 表格内操作按钮区分颜色 */
        .btn-edit {
            background-color: #e6a23c;
            color: #fff;
        }

        .btn-del {
            background-color: #f56c6c;
            color: #fff;
        }

        .btn-borrow {
            background-color: #9c88ff;
            color: #fff;
        }

        /* 分页样式 */
        .page-box {
            margin-top: 20px;
            text-align: center;
        }
        .page-box button {
            min-width: 40px;
            padding: 0 10px;
        }
        .page-info {
            margin: 0 10px;
        }
        .page-btn.active {
            background: #409eff;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="nav">
    <a class="nav-logo" href="#">校园图书借阅管理系统</a>
    <button onclick="location.href='index.html'" style="float: right;margin-top: 10px;">返回</button>
</div>
<div class="container">
    <h2>图书列表</h2>
    <input id="bookname" placeholder="书名搜索">
    <button id="btn_search">搜索</button>
    <button onclick="location.href='bookedit.html'">新增图书</button>
    <table id="bookTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>书名</th>
            <th>作者</th>
            <th>分类</th>
            <th>出版社</th>
            <th>库存</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
    </table>

    <!-- 分页区域 -->
    <div class="page-box" id="pageBox">

    </div>
</div>
<script src="webjars/jquery/3.6.0/jquery.js"></script>
<script>
    let pageNum = 1;
    const pageSize = 10;
    let allBookList = [];

    $(function () {
        let userStr = localStorage.getItem("userInfo");
        if (!userStr) {
            window.location.href = "login.html";
        }
        loadAllBooks();
        $('#btn_search').click(function () {
            pageNum = 1;
            loadAllBooks();
        });
    });

    function loadAllBooks() {
        let bookName = $("#bookname").val().trim();
        $.ajax({
            url: "http://localhost:8080/book/list",
            type: "GET",
            data: {"bookName": bookName},
            success: function (res) {
                if (res.code === 200) {
                    allBookList = res.data;
                    renderPageData(); // 前端切割分页渲染
                }
            },
            error: function () {
                alert("网络连接失败")
            }
        });
    }

    function renderPageData() {
        const total = allBookList.length;
        const totalPage = Math.ceil(total / pageSize);
        if (pageNum < 1) pageNum = 1;
        if (pageNum > totalPage && totalPage > 0) pageNum = totalPage;

        const start = (pageNum - 1) * pageSize;
        const pageData = allBookList.slice(start, start + pageSize);

        renderTable(pageData);
        renderPageBar(total, totalPage);
        bindTableBtn();
    }

    function renderTable(list) {
        let html = "";
        if (list.length === 0) {
            html = `<tr><td colspan="7">暂无数据</td></tr>`;
        } else {
            $.each(list, function (index, item) {
                html += `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.bookName}</td>
                    <td>${item.author}</td>
                    <td>${item.category}</td>
                    <td>${item.publishHouse}</td>
                    <td>${item.stock}</td>
                    <td>
                        <button class="btn btn-edit" data-id="${item.id}">编辑</button>
                        <button class="btn btn_danger btn-del" data-id="${item.id}">删除</button>
                        <button class="btn btn_warning btn-borrow" data-id="${item.id}">借阅</button>
                    </td>
                </tr>`;
            });
        }
        $("#tbody").html(html);
    }

    // 渲染分页栏
    function renderPageBar(total, totalPage) {
        let html = `<span class="page-info">共${total}条，第${pageNum}/${totalPage || 1}页</span>`;
        // 上一页
        if (pageNum > 1) {
            html += `<button class="page-btn prev">上一页</button>`;
        }
        // 页码数字
        for (let i = 1; i <= totalPage; i++) {
            if (i === pageNum) {
                html += `<button class="page-btn active">${i}</button>`;
            } else {
                html += `<button class="page-btn" data-pn="${i}">${i}</button>`;
            }
        }
        // 下一页
        if (pageNum < totalPage) {
            html += `<button class="page-btn next">下一页</button>`;
        }
        $("#pageBox").html(html);

        // 分页点击切换页码
        $(".page-btn").click(function () {
            if ($(this).hasClass("prev")) {
                pageNum--;
            } else if ($(this).hasClass("next")) {
                pageNum++;
            } else {
                pageNum = Number($(this).data("pn"));
            }
            renderPageData(); // 不用重新请求后端，直接切数组
        });
    }

    function bindTableBtn() {
        $(".btn-edit").click(function () {
            let id = $(this).data("id");
            window.location.href = "bookedit.html?id=" + id;
        });
        $(".btn-del").click(function () {
            let id = $(this).data("id");
            if (confirm("确定删除吗？")) {
                $.ajax({
                    url: "http://localhost:8080/book/delete/" + id,
                    type: "DELETE",
                    success: function () {
                        loadAllBooks();
                    }
                });
            }
        });
        $(".btn-borrow").click(function () {
            let bookid = $(this).data("id");
            let userStr = localStorage.getItem("userInfo");
            if (!userStr) {
                alert("登录失效，请重新登陆");
                window.location.href = "login.html";
                return;
            }
            let user = JSON.parse(userStr);
            $.ajax({
                url: "http://localhost:8080/borrow/borrow",
                type: "POST",
                contentType: "application/json;charset=utf-8",
                data: JSON.stringify({"userId": user.id, "bookId": bookid}),
                success: function (res) {
                    if (res.code === 200) {
                        alert("借阅成功")
                        loadAllBooks();
                    } else {
                        alert(res.msg);
                    }
                }
            });
        });
    };
</script>
</body>
</html>
