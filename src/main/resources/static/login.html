<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书管理系统-登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f6f8;
            font-family: "Microsoft Yahei";
        }

        .login-box {
            width: 400px;
            margin: 100px auto;
            padding: 30px;
            border: 1px solid #eee;
            border-radius: 8px;
            box-shadow: 0 0 10px #eee;
            background: #fff;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 22px;
            color: #333;
        }

        .form-item {
            margin-bottom: 20px;
        }

        .form-item label {
            display: block;
            margin-bottom: 8px;
            color: #666;
        }

        .form-item input {
            width: 100%;
            height: 40px;
            padding: 0 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        .btn-login {
            width: 100%;
            height: 42px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .tip {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .tip a {
            color: #409eff;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h3 class="title">校园图书借阅管理系统</h3>
    <div class="form-item">
        <label>账号</label>
        <input type="text" id="username" placeholder="请输入账号">
    </div>
    <div class="form-item">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">
    </div>
    <button class="btn-login" id="loginBtn">登录</button>
    <p class="tip">没有账号？<a href="register.html">立即注册</a></p>
</div>
<script src="webjars/jquery/3.6.0/jquery.js"></script>
<script>
    $(function () {
        $('#loginBtn').click(
            function () {
                let username = $("#username").val().trim();
                let password = $("#password").val().trim();
                if (!username || !password) {
                    alert("用户名或密码不能为空!");
                    return;
                }
                $.ajax(
                    {
                        url: "http://localhost:8080/user/login",
                        type: "POST",
                        contentType: "application/json;charset=utf-8",
                        data: JSON.stringify({"username": username, "password": password}),
                        success: function (res) {
                            if (res.code === 200) {
                                alert("登录成功");
                                localStorage.setItem("userInfo",JSON.stringify(res.data));
                                window.location.href = "index.html";
                            } else {
                                alert(res.msg);
                            }
                        },
                        error: function () {
                            alert("网络错误");
                        }
                    }
                );
            }
        );
    });
</script>

</body>
</html>
