<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f6f8;
            font-family: "Microsoft Yahei";
        }

        .register-box {
            width: 400px;
            margin: 80px auto;
            padding: 30px;
            border: 1px solid #eee;
            border-radius: 8px;
            box-shadow: 0 0 10px #eee;
            background: #fff;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 22px;
            color: #333;
        }

        .form-item {
            margin-bottom: 20px;
        }

        .form-item label {
            display: block;
            margin-bottom: 8px;
            color: #666;
        }

        .form-item input {
            width: 100%;
            height: 40px;
            padding: 0 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        .btn-register {
            width: 100%;
            height: 42px;
            background: #67c23a;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .tip {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .tip a {
            color: #409eff;
            text-decoration: none;
        }

        * {
            margin: 0;
            padding: 0;
            list-style: none;
            text-decoration: none;
        }

        .nav {
            width: 100%;
            height: 60px;
            background: #222;
            line-height: 60px;
            padding: 0 50px;
        }

        .nav-logo {
            color: #fff;
            font-size: 20px;
            font-weight: bold;
        }

        .nav-list {
            display: inline-block;
            margin-left: 50px;
        }

        .nav-list li {
            display: inline-block;
            margin: 0 20px;
        }

        .nav-list li a {
            color: #ccc;
        }

        .nav-list li a:hover {
            color: #fff;
        }

        .nav-user {
            float: right;
            color: #ccc;
            margin-right: 80px;
            background: #222;
        }

        .logout {
            margin-left: 20px;
            padding: 20px 12px;
            background: #555;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

        .container {
            margin-top: 80px;
            text-align: center;
        }

        .container h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .container p {
            color: #666;
        }
    </style>
</head>
<body>
<div class="nav">
    <a class="nav-logo" href="#">校园图书借阅管理系统</a>

</div>
<div class="register-box">
    <h3 class="title">用户注册</h3>
    <div class="form-item">
        <label>账号</label>
        <input type="text" id="username" placeholder="请输入账号">
    </div>
    <div class="form-item">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">
    </div>
    <div class="form-item">
        <label>昵称</label>
        <input type="text" id="nickname" placeholder="请输入昵称">
    </div>
    <div class="form-item">
        <label>手机号</label>
        <input type="text" id="phone" placeholder="请输入手机号">
    </div>
    <button class="btn-register">注册</button>
    <p class="tip">已有账号？<a href="login.html">立即登录</a></p>
</div>
<script src="webjars/jquery/3.6.0/jquery.js"></script>
<script>
    $(function () {
        $(".btn-register").click(function () {
            let username = $('#username').val().trim();
            let password = $('#password').val().trim();
            let nickname = $('#nickname').val().trim();
            let phone = $('#phone').val().trim();
            if (!username || !password) {
                alert("用户名和密码不能为空");
                return;
            }
            $.ajax(
                {
                    url: "http://localhost:8080/user/register",
                    type: "POST",
                    contentType: "application/json;charset=utf-8",
                    data: JSON.stringify({
                        "username": username,
                        "password": password,
                        "nickname": nickname,
                        "phone": phone
                    }),
                    success: function (res) {
                        if (res.code === 200) {
                            alert("注册成功")
                            window.location.href = "login.html";
                        } else {
                            alert(res.msg);
                        }
                    }, error: function () {
                        alert("网络错误")
                    }
                });
        });
    });
</script>

</body>
</html>
